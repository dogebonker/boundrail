name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - name: The real go list never runs repository code
        run: cargo test --locked --test native_go -- --include-ignored

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boundrail-binary
          path: target/debug/boundrail
          if-no-files-found: error

  install:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boundrail-binary
          path: ${{ runner.temp }}/bin
      - run: chmod +x "$RUNNER_TEMP/bin/boundrail"
      - run: shellcheck install.sh ci/model-action.sh ci/test-install.sh
      - name: npm/package.json version is Cargo.toml's
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          npm=$(node -p 'require("./npm/package.json").version')
          [ "$npm" = "$cargo" ] || { echo "::error::npm/package.json $npm, Cargo.toml $cargo"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18
      - run: node --test
        working-directory: npm
        env:
          ARCHGRAPH_TEST_BINARY: ${{ runner.temp }}/bin/boundrail
      - name: install.sh against a fake release on a local server
        run: |
          mkdir "$RUNNER_TEMP/install-test"
          sh ci/test-install.sh "$RUNNER_TEMP/bin/boundrail" "$RUNNER_TEMP/install-test"

