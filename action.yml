name: Boundrail
description: >-
  Check the repository's authored architecture model, annotate its findings and comment the branch's footprint on a
  pull request.
author: dogebonker
branding:
  icon: git-pull-request
  color: blue

inputs:
  path:
    description: >-
      Repository root holding .boundrail/model, relative to the workspace. The step runs boundrail model check and
      annotates its warnings and information. It never passes --language-servers, and passes --no-language-servers so a
      user's config that turns them on cannot either: language servers run code from the checkout, and a pull request
      head is untrusted
    default: "."
  fail-on:
    description: "warnings (the default; any warning fails), information (any finding fails) or never"
    default: warnings
  gate:
    description: >-
      none (the default) or outside. When the pull request body holds one marker line
      <!-- boundrail:proposal ID -->, naming a proposal committed on the branch by its 8-character local ID, the
      footprint runs against that proposal and the comment adds what it names. With outside the step also fails when
      the branch changes a module the proposal does not name, unless that module's changes all lie in changed parts
      (held subjects), and a body the token cannot read, a body without a marker and any event but pull_request are errors (exit 2). With none and no marker the step runs as before
    default: none
  token:
    description: >-
      A token that may comment on the pull request (github.token with pull-requests: write), which also reads the pull
      request body for its proposal marker (see gate). Comments are posted on pull_request events only, and best effort:
      without a token, and where the token cannot write (pull requests from forks, Dependabot runs, read-only tokens), the
      step posts no comment and leaves a notice
    default: ""
  base-ref:
    description: >-
      Commit to compare HEAD against for boundrail model footprint (default the pull request's base commit on
      pull_request). The footprint needs the history down to the base: the step unshallows a shallow checkout, or check
      out with fetch-depth: 0
    default: ""
  version:
    description: boundrail release to install (default the version in this action's own Cargo.toml)
    default: ""
  binary:
    description: Path to a boundrail executable to use instead of downloading a release
    default: ""

runs:
  using: composite
  steps:
    - id: model
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_GATE: ${{ inputs.gate }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_BINARY: ${{ inputs.binary }}
        INPUT_BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha }}
        INPUT_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: '"$GITHUB_ACTION_PATH/ci/model-action.sh"'
